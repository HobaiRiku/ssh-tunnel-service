<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="SSH Tunnel Service">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background: the OS applies its own mask, so no rounded corners here.
       All artwork below is kept inside the central safe zone. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <!-- Mark: the same two-hosts-through-a-tunnel motif, scaled down and centered. -->
  <g transform="translate(256 256) scale(6.5) translate(-32 -32)">
    <path d="M28 25 C 28 36 36 28 36 39" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="25" r="2.7" fill="#ffffff"/>
    <circle cx="36" cy="39" r="2.7" fill="#ffffff"/>
    <rect x="10" y="14" width="20" height="13" rx="3" fill="#ffffff"/>
    <circle cx="14.5" cy="20.5" r="1.6" fill="#2563eb"/>
    <rect x="34" y="37" width="20" height="13" rx="3" fill="#ffffff"/>
    <circle cx="49.5" cy="43.5" r="1.6" fill="#2563eb"/>
  </g>
</svg>
