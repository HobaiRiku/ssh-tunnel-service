<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.json" />
    <title>SSH Tunnel Service</title>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, theme: 'default' });

      const render = async () => {
        const target = document.getElementById('graph');
        try {
          const response = await fetch('/api/topology');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const { mermaid: graph } = await response.json();
          target.textContent = graph;
          await mermaid.run({ nodes: [target] });
        } catch (error) {
          target.textContent = `graph LR\nerror["Topology unavailable: ${String(error)}"]`;
          await mermaid.run({ nodes: [target] });
        }
      };

      render();
      setInterval(render, 5000);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
      main { max-width: 1000px; margin: 2rem auto; padding: 1rem; }
      .card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
      h1 { margin-top: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>SSH Tunnel Topology</h1>
      <div class="card">
        <pre class="mermaid" id="graph">graph LR
    initializing["Loading topology..."]</pre>
      </div>
    </main>
  </body>
</html>
